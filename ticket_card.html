<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ticket Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      body {
        font-family: "IBM Plex Mono", ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>

  <body class="min-h-screen flex items-center justify-center bg-white">
    <!-- Card -->
    <article
      class="w-[236px] h-[408px] rounded-4xl border border-gray-300 p-[6px]"
    >
      <!-- Card Content -->
      <div class="relative w-full h-full overflow-hidden rounded-4xl">
        <!-- Background Image -->
        <img
          src="boudha.jpg"
          alt="Boudhanath Stupa"
          class="absolute inset-0 w-full h-full object-cover"
        />

        <!-- Favorite Button -->
        <button
          type="button"
          aria-label="Add to favorites"
          class="absolute top-4 right-4 w-[35px] h-[35px] p-2.5 flex items-center justify-center rounded-full border border-white/30 bg-white/10 backdrop-blur-xs transition-transform active:scale-95"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="w-full h-full"
          >
            <path
              d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
              stroke="white"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <!-- Glass Container -->
        <div class="absolute inset-x-0 bottom-0 h-[152px]">
          <!-- Weak Blur -->
          <div
            class="absolute inset-0 backdrop-blur-[2px] [-webkit-mask-image:linear-gradient(to_bottom,transparent_0%,black_35%,black_100%)]"
          ></div>

          <!-- Stronger Blur -->
          <div
            class="absolute inset-0 backdrop-blur-[6px] [-webkit-mask-image:linear-gradient(to_bottom,transparent_35%,black_70%,black_100%)]"
          ></div>

          <!-- Glass Tint -->
          <div class="absolute inset-0 bg-green-300/10"></div>

          <!-- Content -->
          <div class="relative px-4 pt-3 text-white">
            <h2 class="text-xl font-bold">Kritiz</h2>

            <p class="text-xs text-gray-200">Economy</p>

            <!-- Ticket Information -->
            <ul class="flex items-center gap-2 mt-3 mb-[18px] text-[10px]">
              <!-- Price Icon -->
              <li>
                <svg
                  viewBox="0 0 24 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  class="size-3"
                  stroke="white"
                  stroke-width="1"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z"
                  />

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6 6h.008v.008H6V6Z"
                  />
                </svg>
              </li>

              <li>From <b>$120</b></li>

              <!-- Flight Icon -->
              <li>
                <svg
                  viewBox="0 0 24 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  class="size-3"
                  stroke="white"
                  stroke-width="1"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"
                  />
                </svg>
              </li>

              <li>
                <b>TIA</b>
              </li>
            </ul>

            <!-- Action -->
            <button
              type="button"
              class="w-full h-[35px] rounded-full bg-white text-black text-[8px] font-bold transition-transform active:scale-95"
            >
              Search flight
            </button>
          </div>
        </div>
      </div>
    </article>
  </body>
</html>
