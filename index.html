<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <img id="back-img" src="background.jpg" alt="Background Image">
        <div class="top">
            <img id="profile-img" src="avatar.svg" alt="Profile Picture">
            <img id="bookmark" src="bookmark.svg" alt="Bookmark Icon">
        </div>
        <div class="content">
            <div class="middle">
                <div class="profile">
                    <h2>Kritiz Sapkota</h2>
                    <span>Web & UI/UX Designer</span>
                </div>
                <div class="tools-section">
                    <div class="tool-icons">
                        <img class="tool-icon" src="canva.svg" alt="Canva Icon">
                        <img class="tool-icon figma" src="figma.svg" alt="Figma Icon">
                    </div>
                    <h3 class="tools">Tools</h3>
                </div>
            </div>
            <div class="bottom">
                <div class="stats">
                    
                    <div>
                        <h2><img class="star" src="star.svg" alt="">4.0</h2>
                        <span>rating</span>
                    </div>

                    <div>
                        <h2>8-Days</h2>
                        <span>duration</span>
                    </div>
                    
                    <div>
                        <h2>$40/hr</h2>
                        <span>rate</span>
                    </div>

                </div>
                <button class="contact-btn">Get in touch</button>
            </div>
        </div>
    </div>
    
</body>
</html>
