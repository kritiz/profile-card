<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <img id="back-img" src="background.jpg" alt="Background Image">
        <img id="profile-img" src="nerd.jpg" alt="Profile Picture">

        <div id="mark">
            <img id="bookmark" src="bookmark.svg" alt="Bookmark Icon">
        </div>

        <div class="content">
            <div class="top">
                <div class="profile">
                    <h2>Kritiz Sapkota</h2>
                    <span>Web & UI/UX Designer</span>
                </div>
                <h3 class="tools">Tools</h3>
            </div>
            <div class="bottom">
                <div class="stats">
                    
                    <div>
                        <h2>4.0</h2>
                        <span>rating</span>
                    </div>

                    <div>
                        <h2>8 Days</h2>
                        <span>duration</span>
                    </div>
                    
                    <div>
                        <h2>$40/hr</h2>
                        <span>rate</span>
                    </div>

                </div>
                <button id="contact-btn">Get in touch</button>
            </div>
        </div>
    </div>
    
</body>
</html>
