<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="profile-card">
      <img id="back-img" src="background.jpg" alt="Background Image" />
      <img id="profile-img" src="avatar.svg" alt="Profile Picture" />
      <img id="bookmark" src="bookmark.svg" alt="Bookmark Icon" />
      <div class="top"></div>
      <div class="middle">
        <div class="profile">
          <h2>Kritiz Sapkota</h2>
          <span>Web & UI/UX Designer</span>
        </div>
        <div class="tools-section">
          <img class="tool-icon" src="canva.svg" alt="Canva Icon" />
          <img class="tool-icon" id="figma" src="figma.svg" alt="Figma Icon" />
          <h3 class="tools">Tools</h3>
        </div>
      </div>
      <footer>
        <ol class="stats-list">
          <li>
            <h3><img class="star" src="star.svg" alt="" />4.0</h3>
            <span>rating</span>
          </li>
          <span class="stat-divider" aria-hidden="true"></span>
          <li>
            <h3>8-hrs</h3>
            <span>duration</span>
          </li>
          <span class="stat-divider" aria-hidden="true"></span>
          <li>
            <h3>$40/hr</h3>
            <span>rate</span>
          </li>
        </ol>
        <button class="contact-btn">Get in touch</button>
      </footer>
    </div>
  </body>
</html>
