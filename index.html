<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <img id="back-img" src="background.jpg" alt="Background Image">
        <img id="profile-img" src="nerd.jpg" alt="Profile Picture">

        <div id="mark">
            <img id="bookmark" src="bookmark.svg" alt="Bookmark Icon">
        </div>

        <div class="profile-info">
            <h2>Kritiz Sapkota</h2>
            <span>Web & UI/UX Designer</span>
        </div>
        <h3>Tools</h3>

        <h2>4.0</h2>
        <span>rating</span>

        <h2>8 Days</h2>
        <span>duration</span>

        <h2>$40/hr</h2>
        <span>rate</span>

        <button id="contact-btn">Get in touch</button>
    </div>
    
</body>
</html>
