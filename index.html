<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Profile Card</title>
</head>
<body>
    <main>
        <div class= "profile-card">
            <img id = "back-img" src="background.jpg" alt="Background Image">

            <img id = "profile-img" src="nerd.jpg" alt="Profile Image">

            <div class="information">
                <div class="top">
                    <div class="info">
                        <h2>Kritiz Sapkota</h2>
                        <span>Web & UI/UX Designer</span>
                    </div>

                    <div class="tools">
                        <h2>Tools</h2>
                    </div>
                </div>   
                <div class="bottom">
                    <div class="stats">
                        <h2>4.0</h2>
                        <span>rating</span>

                        <h2>8 Days</h2>
                        <span>duration</span>

                        <h2>$40/hr</h2>
                        <span>rate</span>
                    </div>
                    <button>Get in touch</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
