<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile Card - Tailwind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM Plex Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "IBM Plex Mono", ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gray-50 flex items-center justify-center font-sans"
  >
    <div
      class="relative w-full max-w-[428px] h-[288px] overflow-hidden rounded-3xl bg-gray-50 border border-gray-200 shadow-lg transition-all duration-500 ease-in-out hover:-translate-y-1 hover:shadow-xl"
    >
      <!-- Background -->
      <div class="relative h-40">
        <img
          class="w-full h-full object-cover"
          src="background.jpg"
          alt="Background Image"
        />

        <!-- Gradient -->
        <div
          class="absolute left-0 right-0 top-0 h-full bg-linear-to-b from-transparent from-70% to-gray-50"
        ></div>
      </div>

      <!-- Avatar -->
      <img
        class="absolute left-5 top-24 w-15 rounded-full"
        src="avatar.svg"
        alt="Profile"
      />

      <!-- Bookmark -->
      <img
        class="absolute right-5 top-24 w-[30px] h-[30px]"
        src="bookmark.svg"
        alt="Bookmark"
      />

      <!-- Profile -->
      <main class="flex items-center justify-between px-5">
        <div>
          <ul class="list-none flex flex-col">
            <li>
              <p class="font-bold text-[14px]">Kritiz Sapkota</p>
            </li>
            <li>
              <span class="flex text-gray-500/80 text-[10px] pt-1">
                Web & UI/UX Designer
              </span>
            </li>
          </ul>
        </div>

        <!-- Tools -->
        <div class="flex items-center gap-2 pr-4">
          <img class="w-5" src="canva.svg" alt="Canva" />

          <img class="w-5 -ml-4" src="figma.svg" alt="Figma" />

          <span class="text-gray-500 text-[10px]"> Tools </span>
        </div>
      </main>

      <!-- Footer -->
      <footer class="flex items-center justify-between px-5 mt-5">
        <!-- Statistics -->
        <div class="flex items-center gap-5 ml-2">
          <!-- Rating -->
          <div class="flex flex-col items-center">
            <p class="flex items-center gap-1 font-bold text-[12px]">
              <img class="w-3" src="star.svg" alt="" />
              4.0
            </p>

            <span class="text-gray-500/80 text-[8px]"> rating </span>
          </div>

          <!-- Divider -->
          <span class="w-px h-10 bg-gray-300"></span>

          <!-- Duration -->
          <div class="flex flex-col items-center">
            <p class="font-bold text-[12px]">8hrs</p>

            <span class="text-gray-500/80 text-[8px]"> duration </span>
          </div>

          <!-- Divider -->
          <span class="w-px h-10 bg-gray-300"></span>

          <!-- Rate -->
          <div class="flex flex-col items-center">
            <p class="font-bold text-[12px]">$10/hr</p>
            <span class="text-gray-500/80 text-[8px]">rate</span>
          </div>
        </div>

        <!-- Button -->
        <button
          class="h-10 w-[136px] rounded-3xl bg-black text-[12px] text-white hover:bg-gray-800 transition duration-500"
        >
          Get in touch
        </button>
      </footer>
    </div>
  </body>
</html>
